<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Configurações básicas de codificação e responsividade (mobile friendly) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Sistema</title>
    
    <!-- Lincando o arquivo CSS de estilos desta vez na mesma pasta raiz -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <!-- Reutilizamos a classe auth-card para criar uma caixa flutuante no centro -->
        <div class="auth-card" style="text-align: center;">
            
            <!-- Título principal de boas vindas para quem recém chegou no site -->
            <h1>Bem-vindo ao Sistema beijaflor</h1>
            
            <!-- Um texto explicativo do propósito dessa tela inicial -->
            <p style="margin-bottom: 30px; color: #4b4f56;">
                Por favor, escolha uma das opções abaixo para continuar.
            </p>

            <!-- Links transformados em botões para facilitar a navegação -->
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Botão principal apontando para a página de Login -->
                <a href="login/index.html" style="text-decoration: none;">
                    <button class="primary-button">Fazer Login</button>
                </a>
                
                <!-- Botão secundário apontando para a página de Cadastro -->
                <!-- Usando uma cor de fundo diferente via estilo inline para diferenciá-lo do login -->
                <a href="cadastro/index.html" style="text-decoration: none;">
                    <button class="primary-button" style="background-color: #42b72a;">Criar Nova Conta</button>
                </a>
            </div>

        </div>
    </main>

</body>

</html>
